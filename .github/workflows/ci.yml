name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Python 3.11 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create project environment
        run: python -m venv .venv

      - name: Install package and development dependencies
        run: .venv/bin/python -m pip install -e ".[dev]"

      - name: Check dependency compatibility
        run: .venv/bin/python -m pip check

      - name: Verify package import
        run: |
          .venv/bin/python -c \
            "import featureforge_stream; print(featureforge_stream.__file__)"

      - name: Run local quality gate
        run: make check

      - name: Check tracked-file whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"

          elif [[ "$EVENT_NAME" == "push" \
              && -n "$PUSH_BEFORE_SHA" \
              && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            git diff --check "$PUSH_BEFORE_SHA" HEAD

          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" HEAD
          fi