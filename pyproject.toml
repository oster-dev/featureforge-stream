[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featureforge-stream"
version = "0.0.1"
description = "A local reference platform for event-time streaming features."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["featureforge_stream*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires the local Docker Compose stack",
]